<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@600;700&display=swap');

body {
  margin: 0;
  padding: 40px;
  background: linear-gradient(135deg, #1a0f0a 0%, #2c1810 50%, #1a0f0a 100%);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

h1 {
  font-family: 'Fredoka One', cursive;
  font-size: 2.8rem;
  background: linear-gradient(90deg, #ffcc00, #ff8c00, #ffcc00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(255,140,0,0.5);
  margin-bottom: 10px;
}

.subtitle {
  color: #e0b080;
  margin-bottom: 40px;
  font-size: 1.1rem;
}
</style>
</head>
<body>

  <!-- 1. BAŞLIĞINI BURAYA YAZ -->
  <h1>SEKS</h1>

  <!-- 2. ALT BAŞLIĞINI BURAYA YAZ -->
  <p class="subtitle">tahsin kalp ruzgar</p>

  <!-- 3. EKSTRA PARAGRAF VEYA YAZI EKLEMEK İSTERSEN BURAYA YAZ -->
  <p>bir gun bir sahabe colde yuruyomus karsısına bir akrep cıkmıs</p>

</body>
</html>
